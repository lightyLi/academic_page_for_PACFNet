name: Convert H5 to ONNX

on:
  workflow_dispatch:
  push:
    branches:
      - ci/convert-onnx

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conversion deps
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow==2.15.1" "tf2onnx==1.16.1" "onnx==1.16.2" "onnxruntime==1.19.2" h5py numpy

      - name: Download H5 from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tmp_convert
          gh release download model-weights-h5 \
            --repo "${{ github.repository }}" \
            --pattern "b2b_20241216_204934_fold_4_model.h5" \
            --dir tmp_convert
          ls -lh tmp_convert

      - name: Convert H5 to ONNX via rebuilt architecture
        run: |
          python scripts/convert_h5_to_onnx/convert.py \
            tmp_convert/b2b_20241216_204934_fold_4_model.h5 \
            tmp_convert

      - name: Upload ONNX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view model-weights-onnx --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create model-weights-onnx \
              --repo "${{ github.repository }}" \
              --title "PACFNet fold-4 ONNX weights" \
              --notes "Converted in GitHub Actions by rebuilding dual_stream_model() and loading H5 weights (opset 17)."
          fi
          gh release upload model-weights-onnx \
            tmp_convert/b2b_20241216_204934_fold_4_model.onnx \
            tmp_convert/b2b_20241216_204934_fold_4_model.onnx.json \
            --repo "${{ github.repository }}" \
            --clobber
          ls -lh tmp_convert/*.onnx*
          gh release view model-weights-onnx --repo "${{ github.repository }}"
